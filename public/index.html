<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site hacké</title>
<style>
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
       background:#000;color:#0f0;font-family:"Courier New",monospace;text-align:center;padding:16px;box-sizing:border-box}
  h1{font-size:clamp(2rem,7vw,4.5rem);margin:0 0 1rem;text-shadow:0 0 12px #0f0;animation:blink 1s steps(2) infinite}
  p{font-size:1.1rem;opacity:.8}
  .invader{filter:drop-shadow(0 0 10px #0f0);margin-bottom:1.5rem;animation:move 1.2s ease-in-out infinite alternate}
  @keyframes move{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
  @keyframes blink{50%{opacity:.4}}
</style>
</head>
<body>
  <div>
    <svg class="invader" viewBox="0 0 11 8" width="176" height="128" shape-rendering="crispEdges" fill="#0f0" aria-label="Space Invader">
      <path d="M2 0h1v1H2zM8 0h1v1H8zM3 1h1v1H3zM7 1h1v1H7zM2 2h7v1H2zM1 3h2v1H1zM4 3h3v1H4zM8 3h2v1H8zM0 4h11v1H0zM0 5h1v1H0zM2 5h7v1H2zM10 5h1v1h-1zM0 6h1v1H0zM2 6h1v1H2zM8 6h1v1H8zM10 6h1v1h-1zM3 7h2v1H3zM6 7h2v1H6z"/>
    </svg>
    <h1>Votre site a été hacké</h1>
    <p id="t"></p>
  </div>
<script>
  const msg = "> Accès système obtenu...", el = document.getElementById("t"); let i = 0;
  (function type(){ if(i <= msg.length){ el.textContent = msg.slice(0, i++); setTimeout(type, 80); } })();
</script>
</body>
</html>
